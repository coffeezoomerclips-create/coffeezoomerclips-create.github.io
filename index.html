<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoffeeZoomer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0e0e10;
            color: #efeff1;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        .logo {
            width: 140px;
            margin-bottom: 10px;
            filter: drop-shadow(0px 0px 12px rgba(191, 148, 255, 0.3));
        }
        h1 { color: #bf94ff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        
        .quote { 
            color: #adadb8; 
            font-style: italic; 
            font-size: 0.95em; 
            margin-bottom: 5px; 
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .quote:hover { color: #bf94ff; }
        .quote-hint { font-size: 0.6em; color: #555; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 1px; }
        .disclaimer { font-size: 0.7em; color: #555; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .embed-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        iframe { border: none; border-radius: 8px; }

        .vault-container {
            margin: 0 auto 40px auto;
            max-width: 960px;
            padding: 20px;
            background-color: #18181b;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .vault-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .vault-title {
            color: #bf94ff;
            text-transform: uppercase;
            font-size: 1.2em;
            font-weight: bold;
        }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            justify-content: center;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .soundboard-container {
            margin: 0 auto 40px auto;
            max-width: 600px;
            padding: 20px;
            background-color: #18181b;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .soundboard-title { color: #bf94ff; text-transform: uppercase; font-size: 1.2em; margin-bottom: 15px; font-weight: bold; }
        .soundboard-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .sound-btn {
            background-color: #2c2c35;
            color: white;
            border: 2px solid #bf94ff;
            padding: 15px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }
        .sound-btn:hover { background-color: #bf94ff; color: #0e0e10; }
        .sound-btn:active { transform: scale(0.95); }
        .shuffle-btn { padding: 8px 15px; font-size: 0.8em; }

        .social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding-bottom: 30px; }
        .social-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 5px; text-decoration: none; color: white; font-family: sans-serif; font-weight: bold; transition: transform 0.2s, opacity 0.2s; }
        .social-btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .youtube { background-color: #FF0000; }
        .tiktok { background-color: #111111; border: 1px solid #333; }
        .twitter { background-color: #000000; border: 1px solid #333; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    </style>
</head>
<body>

    <img src="chibi.png" alt="CoffeeZoomer Mascot" class="logo">
    <h1>CoffeeZoomer</h1>
    
    <div class="quote" id="quote-box" onclick="generateQuote()">"reminds of facebook 2004 when it started xD" - Ricky</div>
    <div class="quote-hint">(Click to cycle quotes)</div>
    
    <div class="disclaimer">Independent 3rd-party archive. Administrator disclaims all legal liability.</div>

    <div class="embed-wrapper">
        <iframe src="https://player.twitch.tv/?channel=coffeezoomer&parent=coffeezoomer.com&parent=www.coffeezoomer.com&parent=coffeezoomerclips-create.github.io" height="540" width="960" allowfullscreen="true"></iframe>
        <iframe src="https://www.twitch.tv/embed/coffeezoomer/chat?parent=coffeezoomer.com&parent=www.coffeezoomer.com&parent=coffeezoomerclips-create.github.io&darkpopout" height="540" width="350"></iframe>
    </div>

    <!-- The Randomized Vault Video Grid -->
    <div class="vault-container">
        <div class="vault-header">
            <div class="vault-title"><i class="fa-solid fa-film"></i> The Reformed Vault</div>
            <button class="sound-btn shuffle-btn" onclick="shuffleVault()"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
        </div>
        <div class="vault-grid">
            <div class="video-wrapper"><iframe id="vid1" src="" allowfullscreen></iframe></div>
            <div class="video-wrapper"><iframe id="vid2" src="" allowfullscreen></iframe></div>
            <div class="video-wrapper"><iframe id="vid3" src="" allowfullscreen></iframe></div>
        </div>
    </div>

    <div class="soundboard-container">
        <div class="soundboard-title"><i class="fa-solid fa-volume-high"></i> The Reformed Board</div>
        <audio id="audio-squeak" src="squeak.mp3"></audio>
        <audio id="audio-slam" src="slam.mp3"></audio>
        <audio id="audio-reformed" src="reformed.mp3"></audio>
        <div class="soundboard-grid">
            <button class="sound-btn" onclick="playSound('audio-squeak')">🦆 Censor Squeak</button>
            <button class="sound-btn" onclick="playSound('audio-slam')">💥 Desk Slam</button>
            <button class="sound-btn" onclick="playSound('audio-reformed')">😇 "I'm Reformed"</button>
        </div>
    </div>

    <div class="social-links">
        <a href="https://youtube.com/@coffeezoomerclips" target="_blank" class="social-btn youtube"><i class="fa-brands fa-youtube"></i> YouTube</a>
        <a href="https://tiktok.com/@coffeezoomerclips" target="_blank" class="social-btn tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>
        <a href="https://x.com/caffeinatedtilt" target="_blank" class="social-btn twitter"><i class="fa-brands fa-x-twitter"></i> Twitter</a>
        <a href="https://instagram.com/coffeezoomerclips" target="_blank" class="social-btn instagram"><i class="fa-brands fa-instagram"></i> Instagram</a>
    </div>

    <script>
        // Soundboard Logic
        function playSound(audioId) {
            var sound = document.getElementById(audioId);
            sound.currentTime = 0; 
            sound.play();
        }

        // Quote Logic
        const quotes = [
            '"reminds of facebook 2004 when it started xD" - Ricky',
            '"Five daggers on Nasus is a highly tactical investment." - Ricky',
            '"This is the final account. Ranked at 30. #Reformed" - Ricky',
            '"Has anyone checked THE BOYS server? He\'s been MIA for days." - Stream Chat',
            '"[User has been suspended for 30 days]" - Twitch Staff',
            '"Wait, was that a desk slam?" - Stream Chat'
        ];
        function generateQuote() {
            const quoteBox = document.getElementById('quote-box');
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteBox.innerText = quotes[randomIndex];
        }

        // Vault Randomizer Logic
        const clipPool = [
            "JPmus5TXon0", // Placeholder 1
            "hKYS6YcC5X0", // Placeholder 2
            "nBoypVqoRrs", // Placeholder 3
            "LgJdw6TTXcM", // Placeholder 4
            "Ukx7pquPkvI"  // Placeholder 5
        ];

        function shuffleVault() {
            let shuffled = [...clipPool].sort(() => 0.5 - Math.random());
            
            document.getElementById('vid1').src = "https://www.youtube.com/embed/" + shuffled[0];
            document.getElementById('vid2').src = "https://www.youtube.com/embed/" + shuffled[1];
            document.getElementById('vid3').src = "https://www.youtube.com/embed/" + shuffled[2];
        }

        window.onload = shuffleVault;
    </script>

</body>
</html>
